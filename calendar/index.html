<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스터디 캘린더 데모</title>
<style>
body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#222}
h1{font-size:22px}
.nav{font-size:14px}
.nav a{color:#0969da;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.dow{text-align:center;font-size:12px;color:#888}
.day{display:block;text-align:center;padding:12px 0;border-radius:8px;background:#f4f4f4;color:#222;text-decoration:none;font-size:14px}
.day.plan{background:#222;color:#fff}
.day:hover{outline:2px solid #222}
.empty{visibility:hidden}
small{color:#888}
</style>
</head>
<body>
<p class="nav"><a href="../">← 목차</a></p>
<h1>2027년 1월 스터디 캘린더</h1>
<p><small>검은 날짜는 플랜이 있는 날입니다. 날짜를 누르면 상세 페이지로 이동합니다.</small></p>
<div class="grid" id="grid"></div>
<script>
var grid=document.getElementById('grid');
['일','월','화','수','목','금','토'].forEach(function(d){var e=document.createElement('div');e.className='dow';e.textContent=d;grid.appendChild(e);});
var start=new Date(2027,0,1).getDay();
for(var i=0;i<start;i++){var e=document.createElement('div');e.className='day empty';grid.appendChild(e);}
var plans=[4,11,18,25];
for(var d=1;d<=31;d++){
var a=document.createElement('a');
a.className='day'+(plans.indexOf(d)>-1?' plan':'');
a.href='detail.html?day='+d;
a.textContent=d;
grid.appendChild(a);
}
</script>
</body>
</html>
